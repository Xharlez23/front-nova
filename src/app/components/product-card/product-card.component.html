<article class="card">
  @if (product.stock < 1) {<span class="tag out flag">Agotado</span>}
  @else if (product.stock <= 5) {<span class="tag low flag">¡Últimas {{ product.stock }}!</span>}
  <a class="imgwrap" [routerLink]="['/producto', product.id]"><app-product-image [src]="product.image" [alt]="product.name" /></a>
  <div class="cb">
    <small>{{ product.category }}</small>
    <h3><a class="name" [routerLink]="['/producto', product.id]">{{ product.name }}</a></h3>
    <div class="price">{{ product.price | cop }}</div>
    <button class="primary small" [disabled]="product.stock < 1" (click)="add.emit(product)">Añadir al carrito</button>
    <a class="more" [routerLink]="['/producto', product.id]">Ver más información →</a>
  </div>
</article>
