<article class="o">
  <header>
    <div><b class="id">#{{ order.id }}</b> <small>{{ order.created_at.slice(0, 10) }}</small></div>
    <app-status-badge [value]="order.status" />
  </header>
  <div class="who">
    <b>{{ order.customer }}</b>
    <span>{{ order.city }} · {{ order.address }}</span>
    <span class="contact">
      <a [href]="'tel:' + order.phone">📞 {{ order.phone }}</a>
      @if (wa) {<a class="wa" [href]="wa" target="_blank" rel="noopener">💬 WhatsApp</a>}
    </span>
  </div>
  <ul>@for (i of order.items; track $index) {<li><span>{{ i.qty }} × {{ i.name }}</span><span>{{ i.price * i.qty | cop }}</span></li>}</ul>
  <footer>
    <b class="tot">{{ order.total | cop }}</b>
    <select [ngModel]="order.status" (ngModelChange)="statusChange.emit($event)" aria-label="Cambiar estado">
      @for (s of statuses; track s) {<option [value]="s">{{ s }}</option>}
    </select>
  </footer>
</article>
