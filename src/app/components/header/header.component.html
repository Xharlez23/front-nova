<header class="top">
  <div class="in">
    <a routerLink="/" class="logo" (click)="close()"><span class="mark">⚡</span>Nova<span class="sub-logo">gadgets</span></a>
    <span class="sp"></span>

    <nav class="links" id="menu" [class.open]="open">
      @if (auth.isAdmin()) {<a routerLink="/admin" (click)="close()">Panel admin</a>}
      @if (auth.user(); as u) {
        <span class="who">{{ u.name }}</span>
        <a href="#" (click)="logout($event)">Salir</a>
      } @else {<a routerLink="/login" (click)="close()">Ingresar</a>}
    </nav>

    <a routerLink="/carrito" class="cart" (click)="close()">🛒 <span class="lbl">Carrito</span> ({{ cart.count() }})</a>

    <button class="burger" [class.on]="open" (click)="toggle()" aria-label="Menú" aria-controls="menu" [attr.aria-expanded]="open">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
@if (open) {<div class="backdrop" (click)="close()"></div>}
