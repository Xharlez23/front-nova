<header class="top">
  <div class="in">
    <a routerLink="/" class="brand" aria-label="Nova, tecnología a tu alcance">
      <img src="logo.png" alt="Nova" class="wave">
      <span class="tagline">Tecnología<br>a tu alcance</span>
    </a>
    <span class="sp"></span>
    <nav class="links">
      @if (auth.isAdmin()) {<a routerLink="/admin" routerLinkActive="on">Panel admin</a>}
      @if (auth.user(); as u) {
        <span class="who">{{ u.name }}</span><a href="#" (click)="logout($event)">Salir</a>
      } @else {<a routerLink="/login" routerLinkActive="on">Ingresar</a>}
      <a routerLink="/carrito" class="cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6.2M9 20h.01M17 20h.01" /></svg>
        Carrito <span class="pill">{{ cart.count() }}</span>
      </a>
    </nav>
  </div>
</header>
